<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATC IFR Clearance Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00cc6a;
    --green-faint: #004422;
    --amber: #ffaa00;
    --amber-dim: #cc8800;
    --red: #ff3333;
    --cyan: #44ddff;
    --bg: #080e0a;
    --panel: #0b150e;
    --border: #1a4028;
    --text: #c8ffd8;
    --text-dim: #5a9970;
    --crt-line: rgba(0,255,100,0.03);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, var(--crt-line) 2px, var(--crt-line) 4px);
    pointer-events: none; z-index: 9999;
  }
  body::after {
    content: '';
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.65) 100%);
    pointer-events: none; z-index: 9998;
  }
  .wrapper { max-width: 960px; margin: 0 auto; padding: 20px; }

  /* HEADER */
  .header { text-align: center; padding: 28px 0 18px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .header-badge { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 6px; color: var(--text-dim); margin-bottom: 8px; animation: flicker 8s infinite; }
  .header h1 { font-family: 'Orbitron', monospace; font-size: clamp(18px,4vw,30px); font-weight: 900; color: var(--green); text-shadow: 0 0 20px var(--green), 0 0 40px var(--green-dim); letter-spacing: 3px; margin-bottom: 5px; }
  .header-sub { font-family: 'VT323', monospace; font-size: 17px; color: var(--amber); letter-spacing: 4px; }
  .blink-dot { display: inline-block; width: 7px; height: 7px; background: var(--green); border-radius: 50%; margin: 0 6px; animation: blink 1s step-end infinite; box-shadow: 0 0 8px var(--green); }

  /* PANELS */
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 2px; padding: 22px; margin-bottom: 16px; position: relative; box-shadow: inset 0 0 40px rgba(0,255,100,0.025); }
  .panel-label { position: absolute; top: -10px; left: 16px; background: var(--panel); padding: 0 8px; font-size: 10px; letter-spacing: 3px; color: var(--text-dim); font-family: 'Orbitron', monospace; }
  .section-num { display: inline-block; background: var(--green-faint); border: 1px solid var(--border); color: var(--green-dim); font-family: 'Orbitron', monospace; font-size: 9px; width: 17px; height: 17px; line-height: 17px; text-align: center; margin-right: 6px; }

  /* FORM */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 10px; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase; font-family: 'Orbitron', monospace; }
  input, textarea { background: #060d08; border: 1px solid var(--border); color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 14px; padding: 9px 12px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; border-radius: 2px; }
  input::placeholder, textarea::placeholder { color: #1e4a2e; }
  input:focus, textarea:focus { border-color: var(--green-dim); box-shadow: 0 0 12px rgba(0,255,100,0.15), inset 0 0 8px rgba(0,255,100,0.04); }

  /* PASTE */
  .paste-area { background: #060d08; border: 1px dashed #1a4028; color: var(--green); font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 12px; width: 100%; min-height: 110px; outline: none; border-radius: 2px; resize: vertical; transition: border-color 0.2s; }
  .paste-area:focus { border-color: var(--amber); border-style: solid; box-shadow: 0 0 14px rgba(255,170,0,0.1); }
  .parse-btn { background: transparent; border: 1px solid var(--amber); color: var(--amber); font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 3px; padding: 8px 18px; cursor: pointer; transition: all 0.2s; margin-top: 8px; }
  .parse-btn:hover { background: rgba(255,170,0,0.1); box-shadow: 0 0 14px rgba(255,170,0,0.25); }
  .parse-status { font-size: 11px; color: var(--amber); margin-top: 5px; min-height: 15px; letter-spacing: 1px; }
  .parse-status.ok { color: var(--green); }

  /* GEN BTN */
  .gen-btn { width: 100%; background: transparent; border: 1px solid var(--green); color: var(--green); font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; letter-spacing: 4px; padding: 15px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; margin-top: 4px; }
  .gen-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(0,255,100,0.13), transparent); transition: left 0.4s; }
  .gen-btn:hover { background: rgba(0,255,100,0.06); box-shadow: 0 0 28px rgba(0,255,100,0.25); text-shadow: 0 0 10px var(--green); }
  .gen-btn:hover::before { left: 100%; }
  .gen-btn:active { transform: scale(0.99); }

  /* TABS */
  .tab-row { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab-btn { background: transparent; border: 1px solid transparent; border-bottom: none; color: var(--text-dim); font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; padding: 9px 18px; cursor: pointer; transition: all 0.2s; position: relative; top: 1px; }
  .tab-btn:hover { color: var(--green); }
  .tab-btn.active { border-color: var(--border); border-bottom-color: #030a05; background: #030a05; color: var(--green); text-shadow: 0 0 8px var(--green); }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

  /* OUTPUT */
  .output-panel { background: #030a05; border: 1px solid var(--green-dim); border-radius: 2px; padding: 26px; margin-top: 18px; display: none; box-shadow: 0 0 28px rgba(0,255,100,0.08), inset 0 0 28px rgba(0,255,100,0.025); }
  .output-panel.active { display: block; animation: fadeIn 0.4s ease; }
  .output-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .output-title { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 4px; color: var(--green-dim); }
  .squawk-badge { background: var(--red); color: white; font-family: 'Orbitron', monospace; font-weight: 900; font-size: 22px; padding: 5px 14px; letter-spacing: 5px; box-shadow: 0 0 20px rgba(255,50,50,0.5); animation: squawkPulse 2s ease-in-out infinite; }
  .squawk-label { font-size: 9px; letter-spacing: 2px; color: var(--text-dim); text-align: right; margin-top: 2px; display: block; }

  .clearance-text { font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 2; color: var(--text); white-space: pre-wrap; }
  .hl-green { color: var(--green); text-shadow: 0 0 8px rgba(0,255,100,0.35); }
  .hl-amber { color: var(--amber); }
  .hl-cyan  { color: var(--cyan); text-shadow: 0 0 8px rgba(68,221,255,0.35); }
  .hl-red   { color: var(--red); font-weight: bold; text-shadow: 0 0 8px rgba(255,50,50,0.4); }
  .hl-dim   { color: var(--text-dim); }

  /* PHRASEOLOGY */
  .phras-title { font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 4px; color: var(--amber); margin-bottom: 14px; }
  .phras-block { background: #040c06; border: 1px solid #1a3822; border-left: 3px solid var(--amber); padding: 14px 16px; margin-bottom: 12px; border-radius: 0 2px 2px 0; }
  .phras-block-label { font-size: 9px; letter-spacing: 3px; color: var(--amber-dim); font-family: 'Orbitron', monospace; margin-bottom: 8px; }
  .phras-text { font-family: 'Share Tech Mono', monospace; font-size: 14px; line-height: 2; color: #e0ffe8; white-space: pre-wrap; }
  .spoken { color: var(--cyan); }
  .pilot-resp { color: #aaffcc; }
  .phras-note { color: var(--text-dim); font-size: 11px; margin-top: 6px; }

  /* ACTION */
  .action-row { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .action-btn { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-dim); font-family: 'Orbitron', monospace; font-size: 9px; letter-spacing: 2px; padding: 9px 6px; cursor: pointer; transition: all 0.2s; }
  .action-btn:hover { border-color: var(--green-dim); color: var(--green); background: rgba(0,255,100,0.04); }
  .action-btn.copied { border-color: var(--green); color: var(--green); box-shadow: 0 0 10px rgba(0,255,100,0.2); }

  /* STATUS */
  .status-bar { display: flex; justify-content: space-between; padding: 7px 0; font-size: 10px; letter-spacing: 2px; color: var(--text-dim); border-top: 1px solid var(--border); margin-top: 18px; }
  .status-online { color: var(--green); }

  /* NOTIF */
  .notification { position: fixed; bottom: 18px; right: 18px; background: var(--green); color: #000; font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 2px; padding: 10px 16px; transform: translateY(60px); transition: transform 0.3s ease; z-index: 10000; box-shadow: 0 0 20px rgba(0,255,100,0.5); }
  .notification.show { transform: translateY(0); }

  /* ANIMATIONS */
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0} }
  @keyframes flicker { 0%,95%,100%{opacity:1}96%{opacity:.7}97%{opacity:1}98%{opacity:.6}99%{opacity:1} }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)} }
  @keyframes squawkPulse { 0%,100%{box-shadow:0 0 20px rgba(255,50,50,.5)}50%{box-shadow:0 0 30px rgba(255,50,50,.8),0 0 50px rgba(255,50,50,.3)} }

  @media (max-width:600px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    .action-row { flex-wrap: wrap; }
    .action-btn { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="header-badge">◈ VIRTUAL ATC SYSTEM ◈</div>
    <h1>IFR CLEARANCE GENERATOR</h1>
    <div class="header-sub">
      <span class="blink-dot"></span>ATC 24 · INSTRUMENT FLIGHT RULES<span class="blink-dot"></span>
    </div>
  </div>

  <!-- STEP 1: Paste -->
  <div class="panel">
    <div class="panel-label"><span class="section-num">1</span>PASTE FLIGHT PLAN</div>
    <textarea class="paste-area" id="pasteArea" placeholder="Paste flight plan here...

Discord: @dogswoof58
Roblox: dogswoof58
Callsign: Air Canada -8547
Aircraft: Bombardier CRJ700
Flight Rules: IFR
Departing: IBTH
Arriving: IRFD
Route: N/A
Flight Level: 020"></textarea>
    <div class="parse-status" id="parseStatus"></div>
    <button class="parse-btn" onclick="parsePlan()">▶ PARSE FLIGHT PLAN</button>
  </div>

  <!-- STEP 2: Fields -->
  <div class="panel">
    <div class="panel-label"><span class="section-num">2</span>FLIGHT DATA</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Callsign</label>
        <input type="text" id="callsign" placeholder="Air Canada -8547">
      </div>
      <div class="form-group">
        <label>Aircraft Type</label>
        <input type="text" id="aircraft" placeholder="Bombardier CRJ700">
      </div>
      <div class="form-group">
        <label>Departing (ICAO)</label>
        <input type="text" id="dep" placeholder="IBTH" maxlength="6" oninput="this.value=this.value.toUpperCase()">
      </div>
      <div class="form-group">
        <label>Arriving (ICAO)</label>
        <input type="text" id="arr" placeholder="IRFD" maxlength="6" oninput="this.value=this.value.toUpperCase()">
      </div>
      <div class="form-group">
        <label>Requested Flight Level</label>
        <input type="text" id="fl" placeholder="FL020 or 2000ft">
      </div>
      <div class="form-group">
        <label>Route / SID</label>
        <input type="text" id="route" placeholder="DCT or N/A">
      </div>
      <div class="form-group">
        <label>Departure Runway</label>
        <input type="text" id="runway" placeholder="e.g. 27L, 09R, 36">
      </div>
      <div class="form-group">
        <label>Departure Frequency (MHz)</label>
        <input type="text" id="depFreq" placeholder="e.g. 121.9">
      </div>
      <div class="form-group">
        <label>Initial Climb Altitude</label>
        <input type="text" id="climbAlt" placeholder="e.g. 3000ft or FL030">
      </div>
      <div class="form-group">
        <label>Roblox Username</label>
        <input type="text" id="roblox" placeholder="dogswoof58">
      </div>
    </div>
  </div>

  <button class="gen-btn" onclick="generate()">⬡ &nbsp; GENERATE IFR CLEARANCE + PHRASEOLOGY &nbsp; ⬡</button>

  <!-- Output -->
  <div class="output-panel" id="outputPanel">
    <div class="output-header">
      <div class="output-title">◈ ATC CLEARANCE ISSUED</div>
      <div>
        <div class="squawk-badge" id="squawkDisplay">----</div>
        <span class="squawk-label">SQUAWK CODE</span>
      </div>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" onclick="switchTab('clearance',this)">CLEARANCE</button>
      <button class="tab-btn" onclick="switchTab('phraseology',this)">PHRASEOLOGY SCRIPT</button>
    </div>

    <div class="tab-content active" id="tab-clearance">
      <div class="clearance-text" id="clearanceText"></div>
    </div>

    <div class="tab-content" id="tab-phraseology">
      <div id="phraseologyText"></div>
    </div>

    <div class="action-row">
      <button class="action-btn" onclick="copyTab()" id="copyBtn">⊕ COPY</button>
      <button class="action-btn" onclick="newSquawk()">↺ NEW SQUAWK</button>
      <button class="action-btn" onclick="generate()">⟳ REGENERATE</button>
    </div>
  </div>

  <div class="status-bar">
    <span><span class="status-online">● ONLINE</span> · ATC24 IFR SYS v2.5</span>
    <span id="clockDisplay"></span>
  </div>
</div>

<div class="notification" id="notification">✓ COPIED TO CLIPBOARD</div>

<script>
  let currentSquawk = '';
  let activeTab = 'clearance';

  function updateClock() {
    const n = new Date();
    document.getElementById('clockDisplay').textContent =
      'ZULU ' + n.getUTCHours().toString().padStart(2,'0') + n.getUTCMinutes().toString().padStart(2,'0') + 'Z';
  }
  updateClock(); setInterval(updateClock, 1000);

  function switchTab(tab, btn) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  function genSquawk() {
    // Only digits 1-7, no 0/8/9, and numeric value must be < 7500
    const digits = [1,2,3,4,5,6,7];
    let sq;
    do {
      sq = Array.from({length:4}, () => digits[Math.floor(Math.random()*digits.length)]).join('');
    } while (parseInt(sq, 10) >= 7500);
    return sq;
  }

  function parsePlan() {
    const raw = document.getElementById('pasteArea').value;
    if (!raw.trim()) { setStatus('⚠ No text detected.', false); return; }
    const map = {};
    raw.split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx > -1) map[line.substring(0,idx).trim().toLowerCase()] = line.substring(idx+1).trim();
    });
    let found = 0;
    const set = (id, keys) => { for (const k of keys) { if (map[k]) { document.getElementById(id).value = map[k]; found++; return; } } };
    set('callsign', ['callsign','call sign','cs']);
    set('aircraft',  ['aircraft','aircraft type','type','plane']);
    set('dep',       ['departing','departure','dep','from','origin']);
    set('arr',       ['arriving','arrival','arr','to','destination','dest']);
    set('fl',        ['flight level','altitude','fl','level','alt']);
    set('route',     ['route','sid','routing','via']);
    set('roblox',    ['roblox','roblox username','username']);
    setStatus(found > 0 ? '✓ ' + found + ' field(s) parsed.' : '⚠ Could not parse. Check format.', found > 0);
  }

  function setStatus(msg, ok) {
    const el = document.getElementById('parseStatus');
    el.textContent = msg;
    el.className = 'parse-status' + (ok ? ' ok' : '');
  }

  function formatFL(raw) {
    if (!raw) return 'AS FILED';
    raw = raw.trim().toUpperCase();
    if (raw.startsWith('FL')) return raw;
    if (/^\d{3}$/.test(raw)) return 'FL' + raw;
    if (/^\d{1,2}$/.test(raw)) return 'FL0' + raw.padStart(2,'0');
    return raw;
  }

  function spellSquawk(sq) {
    const w = {'0':'ZERO','1':'ONE','2':'TWO','3':'THREE','4':'FOUR','5':'FIVE','6':'SIX','7':'SEVEN','8':'EIGHT','9':'NINER'};
    return sq.split('').map(d => w[d]).join(' ');
  }

  function newSquawk() {
    currentSquawk = genSquawk();
    document.getElementById('squawkDisplay').textContent = currentSquawk;
    generate(true);
  }

  // Convert FL/altitude string to a number (in hundreds of feet)
  function flToNumber(s) {
    if (!s || s === 'AS FILED') return null;
    s = s.toUpperCase().trim();
    if (s.startsWith('FL')) {
      const n = parseInt(s.slice(2), 10);
      return isNaN(n) ? null : n;
    }
    // e.g. "3000ft" or "3000FT"
    const m = s.match(/^(\d+)/);
    if (m) return Math.round(parseInt(m[1], 10) / 100);
    return null;
  }

  // Convert number back to FL string
  function numberToFL(n) {
    if (n <= 0) return 'FL010';
    return 'FL' + n.toString().padStart(3, '0');
  }

  function generate(keepSquawk) {
    const callsign = document.getElementById('callsign').value.trim() || 'UNKNOWN';
    const aircraft = document.getElementById('aircraft').value.trim() || 'UNKNOWN AIRCRAFT';
    const dep      = document.getElementById('dep').value.trim().toUpperCase() || 'XXXX';
    const arr      = document.getElementById('arr').value.trim().toUpperCase() || 'XXXX';
    const fl       = formatFL(document.getElementById('fl').value.trim());
    const route    = document.getElementById('route').value.trim() || 'DCT';
    const runway   = document.getElementById('runway').value.trim().toUpperCase() || '??';
    const depFreq  = document.getElementById('depFreq').value.trim() || '???';
    const climbRaw = document.getElementById('climbAlt').value.trim();
    // Auto-enforce: initial climb must be BELOW the requested FL
    const flNum = flToNumber(fl);
    let climbAlt;
    if (climbRaw) {
      const climbFormatted = formatFL(climbRaw);
      const climbNum = flToNumber(climbFormatted);
      if (flNum !== null && climbNum !== null && climbNum >= flNum) {
        const clamped = Math.max(10, flNum - 10);
        climbAlt = numberToFL(clamped);
        document.getElementById('climbAlt').value = climbAlt;
        document.getElementById('climbAlt').style.borderColor = 'var(--amber)';
      } else {
        climbAlt = climbFormatted;
        document.getElementById('climbAlt').style.borderColor = '';
      }
    } else if (flNum !== null && flNum > 10) {
      // Auto-fill default: one step below FL
      climbAlt = numberToFL(flNum - 10);
      document.getElementById('climbAlt').value = climbAlt;
      document.getElementById('climbAlt').style.borderColor = 'var(--amber)';
    } else {
      climbAlt = fl;
    }
    const roblox   = document.getElementById('roblox').value.trim() || 'N/A';

    if (!keepSquawk || !currentSquawk) currentSquawk = genSquawk();

    const now = new Date();
    const zulu = now.getUTCHours().toString().padStart(2,'0') + now.getUTCMinutes().toString().padStart(2,'0') + 'Z';
    const routeText = (route.toUpperCase() === 'N/A' || !route) ? 'DIRECT TO DESTINATION' : route.toUpperCase();
    const callUP = callsign.toUpperCase();
    const sq_spoken = spellSquawk(currentSquawk);
    const climbSpoken = climbAlt.replace('FL','FLIGHT LEVEL ').replace('FT',' FEET').replace('ft',' FEET');
    const flSpoken    = fl.replace('FL','FLIGHT LEVEL ').replace('FT',' FEET').replace('ft',' FEET');

    /* ── CLEARANCE PLAIN ── */
    const plain =
`▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
ATC IFR CLEARANCE  ·  ${zulu}
▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬

[CALLSIGN]    ${callsign}
[ROBLOX]      ${roblox}
[AIRCRAFT]    ${aircraft}
[DEP / ARR]   ${dep} → ${arr}

▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬

${callUP}, CLEARED TO ${arr} AIRPORT AS FILED.
ROUTE: ${routeText}.
EXPECT DEPARTURE RUNWAY ${runway}.
INITIAL CLIMB: ${climbAlt}.
EXPECT ${fl} TEN MINUTES AFTER DEPARTURE.
CONTACT DEPARTURE ON ${depFreq} AFTER TAKEOFF.
SQUAWK: ${currentSquawk}.

▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
READBACK REQUIRED. CONFIRM SQUAWK ${currentSquawk}.
▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬`;

    /* ── CLEARANCE HTML ── */
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    let html = esc(plain);
    // callsign highlight
    html = html.split(esc(callUP)).join('<span class="hl-cyan">'+esc(callUP)+'</span>');
    // arr/dep
    if(arr !== 'XXXX') html = html.split(esc(arr)).join('<span class="hl-amber">'+esc(arr)+'</span>');
    if(dep !== 'XXXX') html = html.split(esc(dep)).join('<span class="hl-amber">'+esc(dep)+'</span>');
    // squawk
    html = html.split(esc(currentSquawk)).join('<span class="hl-red">'+esc(currentSquawk)+'</span>');
    // green keywords
    ['CLEARED TO','INITIAL CLIMB:','EXPECT DEPARTURE RUNWAY','SQUAWK:','READBACK REQUIRED'].forEach(kw=>{
      html = html.split(kw).join('<span class="hl-green">'+kw+'</span>');
    });
    // fl
    if(fl !== 'AS FILED') html = html.split(esc(fl)).join('<span class="hl-green">'+esc(fl)+'</span>');
    if(climbAlt !== fl) html = html.split(esc(climbAlt)).join('<span class="hl-green">'+esc(climbAlt)+'</span>');

    document.getElementById('clearanceText').innerHTML = html;

    /* ── PHRASEOLOGY HTML ── */
    const phHTML = `

  <div class="phras-block-label">① CLEARANCE DELIVERY — ATC SPEAKS</div>
  <div class="phras-text"><span class="spoken">"${callUP}, ${dep} CLEARANCE DELIVERY,

  <div class="phras-text"><span class="pilot-resp">"CLEARED TO ${arr} AS FILED,

  <div class="phras-text"><span class="spoken">"${callUP}, RADAR CONTACT.

  <div class="phras-block-label">⑤ HAND-OFF TO DEPARTURE / NEXT ATC</div>
  <div class="phras-text"><span class="spoken">"${callUP}, CONTACT DEPARTURE ON ${depFreq}.
GOOD DAY."</span></div>
</div>`;

    document.getElementById('phraseologyText').innerHTML = phHTML;
    document.getElementById('squawkDisplay').textContent = currentSquawk;

    /* ── plain phras for copy ── */
    const phrasPlain =
`ATC PHRASEOLOGY SCRIPT

③ ATC CONFIRMS READBACK
"${callUP}, READBACK CORRECT.
SQUAWK ${sq_spoken}.
WHEN READY, CONTACT GROUND FOR PUSHBACK."

④ RADAR CONTACT & VECTORS (after takeoff)
"${callUP}, RADAR CONTACT.

    const panel = document.getElementById('outputPanel');
    panel.dataset.plain = plain;
    panel.dataset.phrasPlain = phrasPlain;
    panel.classList.add('active');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copyTab() {
    const panel = document.getElementById('outputPanel');
    const text = activeTab === 'clearance' ? panel.dataset.plain : panel.dataset.phrasPlain;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✓ COPIED!'; btn.classList.add('copied');
      showNotif();
      setTimeout(() => { btn.textContent = '⊕ COPY'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function showNotif() {
    const n = document.getElementById('notification');
    n.classList.add('show');
    setTimeout(() => n.classList.remove('show'), 2400);
  }

  document.getElementById('pasteArea').addEventListener('paste', () => setTimeout(parsePlan, 100));
</script>
</body>
